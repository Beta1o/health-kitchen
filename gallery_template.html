<style>
/* Layout: sticky search bar with language switch, "Refine results" rail of collapsible facets (drawer on phones), photo-led card grid, recipe opens as a full sheet. RTL for Arabic. */
:root {
  --bg: #eef2ef;
  --surface: #ffffff;
  --surface-2: #f6f8f6;
  --ink: #17262a;
  --muted: #586a68;
  --line: #d6dfdb;
  --accent: #2f6b2a;        /* celery-leaf green */
  --accent-ink: #ffffff;
  --accent-soft: #e2eedc;
  --plum: #7a2e5c;          /* ratings, saved, hints */
  --lo: #2f7d45; --mid: #9a6512; --hi: #b4352d;
  --lo-bg: #e3f1e6; --mid-bg: #f8edd8; --hi-bg: #f7e1de;
  --shadow: 0 1px 2px rgba(23,38,42,.06), 0 8px 24px rgba(23,38,42,.07);
  --font-display: "Bricolage Grotesque", "Noto Kufi Arabic", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "IBM Plex Sans Arabic", "Segoe UI", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111a1c; --surface: #182326; --surface-2: #1e2b2e; --ink: #e7eeec; --muted: #9fb1ae;
  --line: #2c3c3f; --accent: #8cc97f; --accent-ink: #10200d; --accent-soft: #23362a; --plum: #e597c4;
  --lo: #7fcf93; --mid: #e7b65c; --hi: #f08a80; --lo-bg: #1c3325; --mid-bg: #3a2f1a; --hi-bg: #3d2220;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #111a1c; --surface: #182326; --surface-2: #1e2b2e; --ink: #e7eeec; --muted: #9fb1ae;
  --line: #2c3c3f; --accent: #8cc97f; --accent-ink: #10200d; --accent-soft: #23362a; --plum: #e597c4;
  --lo: #7fcf93; --mid: #e7b65c; --hi: #f08a80; --lo-bg: #1c3325; --mid-bg: #3a2f1a; --hi-bg: #3d2220;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme: dark; }
:root[lang="ar"] { --font-display: "Noto Kufi Arabic", "Bricolage Grotesque", system-ui, sans-serif;
                   --font-body: "IBM Plex Sans Arabic", "Atkinson Hyperlegible", system-ui, sans-serif; }

* { box-sizing: border-box; }
#splash { position: fixed; inset: 0; z-index: 1000; background: var(--bg); display: grid; place-items: center; transition: opacity .35s ease, visibility .35s; }
#splash.gone { opacity: 0; visibility: hidden; }
.splash-in { display: grid; justify-items: center; gap: 14px; color: var(--ink); font-family: var(--font-display); }
.splash-in svg { animation: splashPulse 1.4s ease-in-out infinite; border-radius: 18px; }
.splash-in i { width: 120px; height: 4px; border-radius: 99px; background: var(--surface-2); overflow: hidden; position: relative; }
.splash-in i::after { content: ""; position: absolute; inset-block: 0; width: 40%; background: var(--accent); border-radius: 99px; animation: splashBar 1.1s ease-in-out infinite; }
@keyframes splashPulse { 50% { transform: scale(1.06); } }
@keyframes splashBar { from { inset-inline-start: -40%; } to { inset-inline-start: 100%; } }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 var(--font-body); }
button, input, select { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; letter-spacing: -.01em; }
:root[lang="ar"] h1, :root[lang="ar"] h2, :root[lang="ar"] h3 { letter-spacing: 0; line-height: 1.35; }
.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.eyebrow { font-size: .72rem; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
:root[lang="ar"] .eyebrow { letter-spacing: 0; font-size: .8rem; }

/* ---------- top bar ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1480px; margin: 0 auto; padding: 12px 16px; display: flex; gap: 12px; align-items: center; }
.brand { display: flex; align-items: center; gap: 10px; white-space: nowrap; text-decoration: none; color: inherit; }
.brand .logo { flex: none; border-radius: 11px; transition: transform .35s cubic-bezier(.2,.8,.2,1); }
.brand:hover .logo { transform: rotate(-8deg) scale(1.06); }
.brand-txt { display: flex; align-items: baseline; gap: 10px; }
@media (max-width: 980px) { .brand-txt small { display: none; } }
.brand h1 { font-size: 1.45rem; font-weight: 800; }
.brand h1 span { color: var(--accent); }
.brand small { color: var(--muted); font-size: .8rem; }
.search { flex: 1 1 320px; min-width: 220px; position: relative; }
@media (max-width: 1250px) { .top-in .fav-label { display: none; } }
@media (max-width: 1100px) { .view-tabs button { padding: 7px 10px; } }
.search input { width: 100%; padding-block: 11px; padding-inline: 42px 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
.search svg { position: absolute; inset-inline-start: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 9px 14px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; text-decoration: none; color: inherit; }
.icon-btn:hover { border-color: var(--accent); }
.icon-btn[aria-pressed="true"] { border-color: var(--plum); color: var(--plum); }
.langs { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--surface); flex: none; }
.langs button { border: 0; background: none; padding: 8px 12px; cursor: pointer; font-size: .88rem; font-weight: 700; }
.langs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.langs button[data-l="ar"] { font-family: "IBM Plex Sans Arabic", system-ui, sans-serif; }
.only-narrow { display: none; }
.view-tabs { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px; flex: none; }
.view-tabs button { border: 0; background: none; border-radius: 999px; padding: 7px 14px; cursor: pointer; font-weight: 700; font-size: .9rem; color: var(--muted); }
.view-tabs button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
@media (max-width: 1100px) { .brand-txt small { display: none; } }
@media (max-width: 640px) { .view-tabs { display: none; } }

/* ---------- category ribbon ---------- */
.cats { max-width: 1480px; margin: 0 auto; padding: 4px 16px 12px; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: thin; }
.cat { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; cursor: pointer; font-size: .9rem; display: inline-flex; gap: 8px; align-items: center; }
.cat .num { color: var(--muted); font-size: .78rem; }
.cat[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.cat[aria-pressed="true"] .num { color: inherit; opacity: .7; }
.cat i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

/* ---------- main layout ---------- */
.wrap { max-width: 1480px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 60px; display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 26px; align-items: start; }
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 130px); max-height: calc(100vh - 150px); overflow: auto; padding-inline-end: 6px; scrollbar-width: thin; }
.rail-title { font-size: 1.3rem; font-weight: 800; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.facet { border-bottom: 1px solid var(--line); }
.facet summary { list-style: none; cursor: pointer; padding: 14px 2px; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 700; font-size: 1.02rem; }
.facet summary::-webkit-details-marker { display: none; }
.facet summary .sel { margin-inline-start: auto; background: var(--accent); color: var(--accent-ink); font-family: var(--font-data); font-size: .72rem; border-radius: 999px; padding: 1px 8px; }
.facet summary svg { transition: transform .15s; flex: none; color: var(--muted); }
.facet[open] summary svg { transform: rotate(180deg); }
.facet-body { padding: 0 2px 14px; display: grid; gap: 2px; }
.facet-note { font-size: .78rem; color: var(--muted); margin: -4px 0 6px; }
.check { display: flex; align-items: center; gap: 10px; padding: 5px 2px; cursor: pointer; font-size: .94rem; border-radius: 6px; }
.check:hover { background: var(--surface); }
.check input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; flex: none; }
.check .num { margin-inline-start: auto; color: var(--muted); font-size: .78rem; }
.check.zero { opacity: .45; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; }
.preset { border: 1px dashed var(--line); background: none; border-radius: 999px; padding: 5px 11px; font-size: .84rem; cursor: pointer; }
.preset[aria-pressed="true"] { border-style: solid; background: var(--accent-soft); border-color: var(--accent); color: var(--ink); font-weight: 700; }
.slider { display: grid; gap: 2px; margin-bottom: 10px; }
.slider label { display: flex; justify-content: space-between; font-size: .88rem; }
.slider output { font-family: var(--font-data); font-size: .8rem; color: var(--muted); }
.slider input { width: 100%; accent-color: var(--accent); }
.rail .txt { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.linkish { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; font-size: .85rem; text-decoration: underline; font-family: var(--font-body); font-weight: 400; }
.rail-foot { padding-top: 16px; }

/* ---------- results header ---------- */
.res-head { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.res-head h2 { font-size: 1.15rem; font-weight: 700; }
.res-head h2 .num { color: var(--accent); }
.active { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { display: inline-flex; align-items: center; gap: 6px; background: var(--accent-soft); border-radius: 999px; padding-block: 3px; padding-inline: 11px 6px; font-size: .82rem; }
.pill button { border: 0; background: none; cursor: pointer; font-size: 1rem; line-height: 1; padding: 0 4px; color: var(--muted); }
.sort { display: flex; gap: 8px; align-items: center; font-size: .88rem; color: var(--muted); }
.sort select { padding: 7px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); }

/* ---------- cards ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 18px; margin-top: 14px; }
.card { background: var(--surface); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column; cursor: pointer; border: 1px solid transparent; transition: transform .15s ease, border-color .15s; position: relative; }
.card:hover { transform: translateY(-2px); border-color: var(--line); }
.thumb { aspect-ratio: 4 / 3; max-width: 100%; position: relative; overflow: hidden; background: var(--surface-2); }
.thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transition: opacity .3s; }
.thumb img.ok { opacity: 1; }
.ph { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; padding: 14px; color: #fff; overflow: hidden; }
.ph b { font-family: var(--font-display); font-weight: 800; font-size: 1.3rem; line-height: 1.12; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; position: relative; }
.ph .art { position: absolute; inset: 0; width: 100%; height: 100%; }
.ph b { text-shadow: 0 1px 12px rgba(0,0,0,.25); }
.badges { position: absolute; top: 10px; inset-inline-start: 10px; display: flex; gap: 6px; }
.badge { background: rgba(10,20,22,.72); color: #fff; font-size: .72rem; font-weight: 700; padding: 3px 8px; border-radius: 999px; display: inline-flex; align-items: center; gap: 4px; }
.fav { position: absolute; top: 8px; inset-inline-end: 8px; width: 36px; height: 36px; border-radius: 50%; border: 0; background: rgba(255,255,255,.92); color: #7a2e5c; cursor: pointer; display: grid; place-items: center; }
.fav[aria-pressed="true"] svg { fill: currentColor; }
.card-body { padding: 12px 14px 14px; display: grid; gap: 8px; flex: 1; align-content: start; }
.card-body h3 { font-size: 1.04rem; font-weight: 700; line-height: 1.3; }
.meta-line { display: flex; gap: 8px; align-items: center; font-size: .8rem; color: var(--muted); flex-wrap: wrap; }
.stars { color: var(--plum); letter-spacing: 1px; font-size: .85rem; direction: ltr; }
.renal { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: auto; }
.mineral { border-radius: 8px; padding: 5px 7px; display: grid; }
.mineral span { font-size: .66rem; font-weight: 700; letter-spacing: .04em; opacity: .9; }
.mineral b { font-family: var(--font-data); font-weight: 600; font-size: .86rem; }
.mineral b small { font-size: .62rem; font-weight: 500; opacity: .8; }
.lv-lo { background: var(--lo-bg); color: var(--lo); }
.lv-mid { background: var(--mid-bg); color: var(--mid); }
.lv-hi { background: var(--hi-bg); color: var(--hi); }
.lv-na { background: var(--surface-2); color: var(--muted); }
.more { display: flex; justify-content: center; padding: 28px 0 0; }
.empty { padding: 60px 20px; text-align: center; color: var(--muted); grid-column: 1 / -1; }
.empty h3 { color: var(--ink); margin-bottom: 6px; }

/* ---------- recipe sheet ---------- */
.recipe-page { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 40px; animation: sheetIn .45s cubic-bezier(.2,.8,.2,1); }
.recipe-page .sheet-in { background: var(--bg); }
body.reading .hero-band, body.reading .wrap, body.reading .cats, body.reading footer.site { display: none; }


.sheet-bar { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--hdr, 70px)); border-radius: 14px; z-index: 2; display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; padding: 10px 16px; padding-top: calc(10px + env(safe-area-inset-top, 0px)); background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.sheet-bar .grp { display: flex; gap: 8px; flex-wrap: wrap; }
.hero { position: relative; max-width: 100%; height: clamp(220px, 34vw, 420px); background: var(--surface-2); overflow: hidden; border-radius: 18px; margin-top: 12px; }
.hero .backdrop { position: absolute; inset: -30px; width: calc(100% + 60px); height: calc(100% + 60px); object-fit: cover; filter: blur(28px) saturate(1.2); opacity: .55; }
.hero .photo { position: relative; display: block; height: 100%; width: auto; max-width: 100%; margin: 0 auto; object-fit: contain; animation: kenburns 9s ease-out both; }
.hero .ph b { font-size: clamp(1.4rem, 3vw, 2.2rem); -webkit-line-clamp: 2; }
.hero.nophoto { height: clamp(96px, 12vw, 140px); }

.hero.nophoto .ph b { font-size: clamp(1.2rem, 2.4vw, 1.7rem); }
.sheet-body { max-width: 1100px; margin-inline: auto; }
@media print {
  @page { margin: 14mm; }
  body { background: #fff; color: #000; font-size: 11pt; }
  .top, .sheet-bar, .hero-band, .wrap, footer.site, .add-day, .fav, .video, .video-link, .tr-note button, dialog { display: none !important; }
  .recipe-page { padding: 0; max-width: none; animation: none; }
  .hero { height: 70mm; border-radius: 8px; margin: 0 0 6mm; break-inside: avoid; }
  .hero.nophoto { display: none; }
  .hero .photo { animation: none; }
  .sheet-body { padding: 0; gap: 5mm; }
  .cols { grid-template-columns: 1.4fr 1fr; gap: 6mm; }
  ol.steps li, .ntable tr, .box, .dv { break-inside: avoid; }
  ol.steps li { border: 0; padding: 2px 0; background: none; }
  ul.ing input { display: none; }
  ul.ing li label { padding: 1px 0; }
  ul.ing li label::before { content: "□"; margin-inline-end: 6px; }
  .bar i, .gauge i, .ring .val, .card { animation: none !important; }
  .facts, .ntable, .box, .dv, .hints { box-shadow: none; }
  a[href]::after { content: ""; }
  .print-src { display: block !important; font-size: 9pt; color: #444; margin-top: 4mm; }
}
.print-src { display: none; }
.sheet-body { padding-inline: 22px; padding-block: 22px 50px; display: grid; gap: 22px; }
.title-row h2 { font-size: clamp(1.7rem, 3.5vw, 2.4rem); font-weight: 800; line-height: 1.15; }
.title-row p { color: var(--muted); max-width: 70ch; margin: 8px 0 0; }
.tr-note { display: inline-flex; gap: 6px; align-items: center; font-size: .8rem; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; margin-top: 10px; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); background: var(--surface); border-radius: var(--radius); border: 1px solid var(--line); margin: 0; }
.facts > div { padding: 12px 16px; border-inline-end: 1px solid var(--line); min-width: 0; }
.facts > div:last-child { border-inline-end: 0; }
.facts dd { margin: 2px 0 0; font-weight: 700; }
.facts dt { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
:root[lang="ar"] .facts dt { letter-spacing: 0; font-size: .82rem; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: .82rem; border: 1px solid var(--line); background: var(--surface); padding: 3px 10px; border-radius: 999px; }
.chip.diet { background: var(--accent-soft); border-color: transparent; font-weight: 700; }
.cols { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 26px; align-items: start; }
.panel h3 { font-size: 1.2rem; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.group-label { font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin: 14px 0 4px; }
ul.ing { list-style: none; padding: 0; margin: 0; display: grid; gap: 2px; }
ul.ing li label { display: flex; gap: 10px; align-items: flex-start; padding: 6px 4px; border-radius: 8px; cursor: pointer; }
ul.ing li label:hover { background: var(--surface); }
ul.ing input { width: 19px; height: 19px; margin-top: 3px; accent-color: var(--accent); flex: none; }
ul.ing input:checked + span { text-decoration: line-through; color: var(--muted); }
ol.steps { list-style: none; padding: 0; margin: 0; counter-reset: s; display: grid; gap: 10px; }
ol.steps li { counter-increment: s; display: grid; grid-template-columns: 34px 1fr; gap: 10px; cursor: pointer; padding: 8px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); }
ol.steps li::before { content: counter(s); font-family: var(--font-data); font-weight: 600; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
ol.steps li.done { opacity: .5; }
ol.steps li.done::before { content: "✓"; background: var(--accent); color: var(--accent-ink); }
.hints { background: var(--surface); border-inline-start: 4px solid var(--plum); border-start-end-radius: var(--radius); border-end-end-radius: var(--radius); padding: 14px 18px; }
.hints ul { margin: 0; padding-inline-start: 20px; display: grid; gap: 6px; }
.ntable { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--line); overflow: hidden; }
.ntable table { width: 100%; border-collapse: collapse; }
.ntable td { padding: 9px 14px; border-bottom: 1px solid var(--line); font-size: .95rem; }
.ntable tr:last-child td { border-bottom: 0; }
.ntable td:last-child { text-align: end; font-family: var(--font-data); font-variant-numeric: tabular-nums; white-space: nowrap; direction: ltr; }
.ntable tr.key td:first-child { font-weight: 700; }
.lvl { font-size: .68rem; font-weight: 700; padding: 2px 7px; border-radius: 999px; margin-inline-start: 8px; vertical-align: 1px; }
.side { display: grid; gap: 20px; }
.box { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--line); padding: 14px 16px; }
.box h3 { font-size: 1rem; margin-bottom: 6px; }
.box ul { margin: 0; padding-inline-start: 18px; }
.carb-big { font-family: var(--font-display); font-size: 2.4rem; font-weight: 800; line-height: 1; color: var(--accent); }
.video { background: #000; border-radius: var(--radius); overflow: hidden; }
.video video { width: 100%; display: block; aspect-ratio: 16/9; max-width: 100%; }
.video-link { display: flex; gap: 14px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; text-decoration: none; color: var(--ink); margin-top: 10px; }
.video-link .play { width: 46px; height: 46px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
.foot-note { color: var(--muted); font-size: .85rem; font-weight: 400; font-family: var(--font-body); }
.toast { position: fixed; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: .9rem; z-index: 100; }
footer.site { max-width: 1480px; margin: 0 auto; padding-inline: 16px; padding-block: 0 40px; color: var(--muted); font-size: .82rem; }
/* ---------- hero ---------- */
html, body { overflow-x: clip; max-width: 100%; }
.dash, .wrap, .hero-band, .recipe-page { max-width: min(1480px, 100%); }
.hero-band { max-width: 1480px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 6px; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, .75fr); gap: 22px; align-items: stretch; }

:root[lang="ar"] .hero-copy h2 { line-height: 1.3; letter-spacing: 0; }
.hero-copy h2 em { font-style: normal; color: var(--accent); position: relative; white-space: nowrap; }
.hero-copy h2 em::after { content: ""; position: absolute; inset-inline: 0; bottom: .06em; height: .14em; background: var(--plum); opacity: .35; border-radius: 4px; transform-origin: inline-start; animation: underline 1.1s .4s cubic-bezier(.2,.8,.2,1) both; }
.hero-copy p { margin: 0; color: var(--muted); max-width: 56ch; font-size: 1.04rem; }
.stats { display: flex; flex-wrap: wrap; gap: 10px 26px; margin-top: 4px; }
.stat b { display: block; font-family: var(--font-display); font-size: 1.9rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.stat span { font-size: .78rem; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; font-size: .8rem; padding: 4px 10px; border-radius: 999px; }
.stage { position: relative; aspect-ratio: 5 / 4; max-width: 100%; }
.slide { position: absolute; inset: 0; border-radius: 22px; overflow: hidden; box-shadow: var(--shadow); cursor: pointer; transition: transform .8s cubic-bezier(.2,.8,.2,1), opacity .8s, filter .8s; background: var(--surface-2); }
.slide img { width: 100%; height: 100%; object-fit: cover; display: block; }
.slide.s0 { transform: translate3d(0,0,0) rotate(0deg); z-index: 3; }
.slide.s0 img { animation: kenburns 7s ease-out both; }
.slide.out { opacity: 0; z-index: 4; }
.slide { border-radius: 20px; }
.slide-cap { position: absolute; inset-inline: 0; bottom: 0; padding: 40px 18px 34px; background: linear-gradient(transparent, rgba(6,14,16,.82)); color: #fff; display: grid; gap: 6px; }
.slide-cap small { font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; opacity: .85; }
.slide-cap b { font-family: var(--font-display); font-size: 1.35rem; line-height: 1.15; }
.slide-cap .chips span { background: rgba(255,255,255,.16); backdrop-filter: blur(4px); color: #fff; border: 0; font-size: .74rem; padding: 3px 9px; border-radius: 999px; }
.dots { position: absolute; bottom: 12px; z-index: 5; inset-inline-start: 50%; transform: translateX(-50%); display: flex; gap: 6px; }
[dir="rtl"] .dots { transform: translateX(50%); }
.dots button { width: 8px; height: 8px; border-radius: 99px; border: 0; background: rgba(255,255,255,.55); cursor: pointer; padding: 0; transition: width .3s, background .3s; }
.dots button[aria-current="true"] { width: 22px; background: var(--accent); }

/* ---------- views ---------- */
body.view-dash .about, body.view-recipes .about, body.view-recipes .cond-switch { display: none; }
body.view-about .hero-band, body.view-about .dash, body.view-about .wrap, body.view-about .cats, body.view-about .cond-switch { display: none; }
body.reading .about, body.reading .cond-switch { display: none; }
.cond-switch { max-width: min(1480px, 100%); margin: 0 auto; padding-inline: 16px; padding-block: 18px 0; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.cond-switch button { flex: none; display: inline-flex; align-items: center; gap: 8px; border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 9px 16px; cursor: pointer; font-weight: 700; font-size: .92rem; transition: all .2s; }
.cond-switch button i { font-style: normal; font-size: 1.05rem; }
.sub-switch { display: inline-flex; flex: none; align-items: center; gap: 2px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.cond-switch .sub-switch button { border: 0; padding: 6px 12px; font-size: .84rem; background: none; color: var(--muted); box-shadow: none; }
.cond-switch .sub-switch button[aria-pressed="true"] { background: var(--surface); color: var(--accent); border: 0; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.cond-switch button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); box-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 30%, transparent); }
.about { max-width: min(1100px, 100%); margin: 0 auto; padding-inline: 16px; padding-block: 34px 60px; display: grid; gap: 36px; }
.about-hero { display: grid; gap: 14px; }
.about-hero .eyebrow { color: var(--accent); }
.about-hero h2 { font-size: clamp(2rem, 4.4vw, 3.4rem); font-weight: 800; line-height: 1.05; letter-spacing: -.03em; }
:root[lang="ar"] .about-hero h2 { line-height: 1.3; letter-spacing: 0; }
.about-hero h2 em { font-style: normal; color: var(--accent); }
.about-hero p { margin: 0; color: var(--muted); max-width: 60ch; font-size: 1.05rem; }
.about-body { display: grid; gap: 30px; }
.about-body h3 { font-size: 1.3rem; margin-bottom: 10px; }
.how { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.how div { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 6px; }
.how b { font-family: var(--font-display); font-size: 1.05rem; }
.how span { color: var(--muted); font-size: .92rem; }
.how i { font-style: normal; font-size: 1.6rem; }
.src-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.src { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; display: grid; gap: 6px; text-decoration: none; color: var(--ink); transition: transform .2s, border-color .2s; }
.src:hover { transform: translateY(-2px); border-color: var(--accent); }
.src b { font-family: var(--font-display); font-size: 1.02rem; display: flex; justify-content: space-between; gap: 8px; }
.src b span { font-family: var(--font-data); color: var(--accent); font-size: .9rem; }
.src small { color: var(--muted); }
.src u { text-decoration: none; color: var(--accent); font-size: .82rem; direction: ltr; text-align: start; overflow-wrap: anywhere; }
.share-row { display: flex; flex-wrap: wrap; gap: 8px; }
.disclaimer { background: color-mix(in srgb, var(--mid) 10%, transparent); border-radius: 14px; padding: 14px 16px; font-size: .92rem; }
body.view-dash .wrap, body.view-dash .cats { display: none; }
body.view-recipes .hero-band, body.view-recipes .dash { display: none; }
.dash { max-width: 1480px; margin: 0 auto; padding-inline: 16px; padding-block: 26px 40px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 34px; }
.dash-sec { min-width: 0; }
#dPlan { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 760px) { #dPlan { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.dash-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 12px; }
.dash-head h2 { font-size: 1.35rem; font-weight: 800; }
.cat-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.cat-tile { position: relative; aspect-ratio: 4 / 3; border-radius: 16px; overflow: hidden; border: 0; cursor: pointer; padding: 0; text-align: start; color: #fff; box-shadow: var(--shadow); transition: transform .25s cubic-bezier(.2,.8,.2,1); animation: rise .5s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 40ms); }
.cat-tile:hover { transform: translateY(-3px) rotate(-.6deg); }
.cat-tile .art, .cat-tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cat-tile img { filter: saturate(1.05); }
.cat-tile::after { content: ""; position: absolute; inset: 0; background: linear-gradient(transparent 35%, rgba(6,14,16,.75)); }
.cat-tile span { position: absolute; inset-inline: 12px; bottom: 10px; z-index: 1; display: grid; }
.cat-tile b { font-family: var(--font-display); font-size: 1.02rem; line-height: 1.2; }
.cat-tile small { opacity: .85; font-family: var(--font-data); font-size: .75rem; }
.hscroll { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(230px, 260px); gap: 14px; overflow-x: auto; padding-bottom: 8px; scroll-snap-type: x mandatory; scrollbar-width: thin; }
.hscroll > * { scroll-snap-align: start; }
.dash-cta { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; align-items: center; }
.btn-primary.big { font-size: 1.1rem; padding: 14px 28px; box-shadow: 0 8px 24px color-mix(in srgb, var(--accent) 35%, transparent); transition: transform .2s; }
.btn-primary.big:hover { transform: translateY(-2px); }
/* ---------- dashboard tools ---------- */
.targets { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.target { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; display: grid; gap: 2px; animation: rise .5s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 40ms); }
.target span { font-size: .76rem; color: var(--muted); font-weight: 700; }
.target b { font-family: var(--font-display); font-size: 1.5rem; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
.target small { font-size: .74rem; color: var(--muted); }
.target.accent { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.target.accent span, .target.accent small { color: inherit; opacity: .85; }
.tips-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.tip-card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 12px; align-items: start; animation: rise .5s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 50ms); }
.tip-card i { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-style: normal; font-size: 1.2rem; background: var(--accent-soft); }
.tip-card p { margin: 0; font-size: .92rem; }
.tools-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.tool { text-align: start; border: 1px solid var(--line); background: var(--surface); border-radius: 16px; padding: 14px; cursor: pointer; display: grid; gap: 6px; transition: transform .2s, border-color .2s; }
.tool:hover { transform: translateY(-2px); border-color: var(--accent); }
.tool i { font-style: normal; font-size: 1.5rem; }
.tool b { font-family: var(--font-display); font-size: 1rem; }
.tool span { font-size: .8rem; color: var(--muted); }
.tool svg.spark { width: 100%; height: 40px; }
.calc-out { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 8px; }
.calc-out .big { font-family: var(--font-display); font-size: 2rem; font-weight: 800; color: var(--accent); line-height: 1; }
.calc-row { display: flex; justify-content: space-between; gap: 10px; font-size: .92rem; border-bottom: 1px dashed var(--line); padding-bottom: 6px; }
.calc-row:last-child { border-bottom: 0; }
.calc-row b { font-family: var(--font-data); direction: ltr; }
.wchart { width: 100%; height: 160px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.wlist { display: grid; gap: 4px; max-height: 180px; overflow: auto; font-family: var(--font-data); font-size: .85rem; }
.wlist div { display: flex; justify-content: space-between; gap: 8px; padding: 4px 8px; background: var(--surface); border-radius: 8px; }
/* ---------- today ---------- */
.today { display: grid; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px; box-shadow: var(--shadow); }
.today-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.today-top h3 { font-size: 1.25rem; }
.today-top .chipset { display: flex; gap: 6px; flex-wrap: wrap; }
.streak { display: inline-flex; gap: 6px; align-items: center; background: var(--mid-bg); color: var(--mid); font-weight: 700; font-size: .82rem; border-radius: 999px; padding: 4px 10px; }
.mini-rings { display: grid; grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); gap: 8px; }
.mini-rings .ring svg { width: 64px; height: 64px; }
.mini-rings .ring .pc { margin-top: -48px; height: 48px; font-size: .85rem; }
.mini-rings .ring { font-size: .72rem; }
.next-meal { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; align-items: center; background: var(--surface-2); border-radius: 14px; padding: 8px; cursor: pointer; transition: transform .2s; }
.next-meal:hover { transform: translateY(-2px); }
.next-meal .thumb { aspect-ratio: 1; border-radius: 10px; }
.next-meal .ph b { display: none; }
.next-meal small { color: var(--accent); font-weight: 700; font-size: .74rem; letter-spacing: .06em; text-transform: uppercase; }
:root[lang="ar"] .next-meal small { letter-spacing: 0; }
.next-meal h4 { margin: 2px 0; font-family: var(--font-display); font-size: 1rem; line-height: 1.25; }
.next-meal span { font-size: .78rem; color: var(--muted); }
.tip { display: flex; gap: 10px; align-items: flex-start; font-size: .9rem; color: var(--ink); background: color-mix(in srgb, var(--plum) 9%, transparent); border-radius: 12px; padding: 10px 12px; }
.tip b { color: var(--plum); white-space: nowrap; }
.pick-plan { display: flex; flex-wrap: wrap; gap: 6px; }
.pick-plan button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 7px 12px; cursor: pointer; font-size: .86rem; }
.pick-plan button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

/* ---------- cook mode ---------- */
dialog.cook { border: 0; padding: 0; width: 100%; height: 100%; max-width: 100%; max-height: 100%; background: var(--bg); color: var(--ink); }
.cook-in { height: 100%; display: grid; grid-template-rows: auto auto 1fr auto; gap: 14px; padding: calc(14px + env(safe-area-inset-top, 0px)) 18px calc(18px + env(safe-area-inset-bottom, 0px)); max-width: 900px; margin: 0 auto; }
.cook-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.cook-head h2 { font-size: 1.1rem; }
.cook-progress { height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.cook-progress i { display: block; height: 100%; background: var(--accent); transition: inline-size .4s cubic-bezier(.2,.8,.2,1); }
.cook-step { align-self: center; display: grid; gap: 18px; animation: rise .4s cubic-bezier(.2,.8,.2,1) both; }
.cook-step .n { font-family: var(--font-data); color: var(--accent); font-weight: 600; }
.cook-step p { margin: 0; font-size: clamp(1.35rem, 3.6vw, 2.1rem); line-height: 1.45; font-weight: 500; }
.timers { display: flex; flex-wrap: wrap; gap: 8px; }
.timer { display: inline-flex; align-items: center; gap: 8px; border: 2px solid var(--accent); color: var(--accent); background: var(--surface); border-radius: 999px; padding: 10px 16px; font-weight: 700; cursor: pointer; font-family: var(--font-data); font-size: 1rem; }
.timer.run { background: var(--accent); color: var(--accent-ink); }
.timer.done { background: var(--plum); border-color: var(--plum); color: #fff; animation: pop .5s ease 3; }
.cook-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cook-nav button { padding: 16px; font-size: 1.05rem; border-radius: 16px; }
.cook-ing { max-height: 40vh; overflow: auto; background: var(--surface); border-radius: 14px; padding: 10px 14px; }
.btn-cook { display: inline-flex; gap: 8px; align-items: center; }

/* ---------- motion ---------- */
@keyframes rise { from { transform: translateY(14px) scale(.985); opacity: .35; } to { transform: none; opacity: 1; } }
@keyframes kenburns { from { transform: scale(1.12) translate(1%, 1%); } to { transform: scale(1) translate(0,0); } }
@keyframes underline { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.35); } 100% { transform: scale(1); } }
@keyframes burst { from { transform: translate(-50%,-50%) scale(.2); opacity: 1; } to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1); opacity: 0; } }
@keyframes sheetIn { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fill { from { inline-size: 0; } }
@keyframes ring { from { stroke-dashoffset: var(--c); } }
@keyframes celebrate { 0% { transform: translate(-50%, 20px) scale(.8); opacity: 0; } 15% { transform: translate(-50%, 0) scale(1); opacity: 1; } 85% { opacity: 1; } 100% { transform: translate(-50%, -10px); opacity: 0; } }
.card { animation: rise .55s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 35ms); }
.card .thumb img { transition: opacity .3s, transform .6s cubic-bezier(.2,.8,.2,1); }
.card:hover .thumb img.ok { transform: scale(1.06); }
.card:hover { box-shadow: 0 2px 4px rgba(23,38,42,.06), 0 18px 40px rgba(23,38,42,.14); }
.fav.popping { animation: pop .45s ease; }
.spark { position: fixed; width: 7px; height: 7px; border-radius: 50%; pointer-events: none; z-index: 200; animation: burst .7s ease-out forwards; }

dialog.panel-dlg[open] { animation: sheetIn .35s cubic-bezier(.2,.8,.2,1); }
.bar i { animation: fill .9s cubic-bezier(.2,.8,.2,1) both; }
.gauge { height: 4px; border-radius: 99px; background: color-mix(in srgb, currentColor 18%, transparent); overflow: hidden; margin-top: 3px; }
.gauge i { display: block; height: 100%; background: currentColor; border-radius: 99px; animation: fill .9s .15s cubic-bezier(.2,.8,.2,1) both; }
.rings { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 12px; }
.ring { display: grid; justify-items: center; gap: 4px; text-align: center; font-size: .8rem; }
.ring svg { width: 84px; height: 84px; transform: rotate(-90deg); }
[dir="rtl"] .ring svg { transform: rotate(-90deg) scaleY(-1); }
.ring circle { fill: none; stroke-width: 9; }
.ring .track { stroke: var(--surface-2); }
.ring .val { stroke-linecap: round; animation: ring 1.1s cubic-bezier(.2,.8,.2,1) both; }
.ring .pc { font-family: var(--font-data); font-weight: 600; font-size: 1rem; margin-top: -60px; height: 60px; }
.celebrate { position: fixed; left: 50%; bottom: 90px; background: var(--accent); color: var(--accent-ink); font-weight: 700; padding: 12px 22px; border-radius: 999px; z-index: 300; animation: celebrate 2.4s ease forwards; box-shadow: var(--shadow); }
.src-badge { background: rgba(255,255,255,.92); color: #17262a; }
@media (prefers-reduced-motion: reduce) {
  .card, .slide.s0 img, .bar i, .gauge i, .ring .val, .recipe-page, .hero .photo, dialog.panel-dlg[open], .hero-copy h2 em::after { animation: none !important; }
  .slide { transition: none; }
}
@media (max-width: 980px) { .hero-band { grid-template-columns: minmax(0, 1fr); } .hero-band .stage { min-height: 0; aspect-ratio: 16 / 10; } }
@media (max-width: 640px) { .hero-copy h2 { font-size: 1.9rem; } .stage { aspect-ratio: 4 / 3; } }

/* kidney plan, meters, planner */
.plan-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 10px; display: grid; gap: 8px; }
