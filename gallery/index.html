<style>
/* Layout: sticky search bar with language switch, "Refine results" rail of collapsible facets (drawer on phones), photo-led card grid, recipe opens as a full sheet. RTL for Arabic. */
:root {
  --bg: #eef2ef;
  --surface: #ffffff;
  --surface-2: #f6f8f6;
  --ink: #17262a;
  --muted: #586a68;
  --line: #d6dfdb;
  --accent: #2f6b2a;        /* celery-leaf green */
  --accent-ink: #ffffff;
  --accent-soft: #e2eedc;
  --plum: #7a2e5c;          /* ratings, saved, hints */
  --lo: #2f7d45; --mid: #9a6512; --hi: #b4352d;
  --lo-bg: #e3f1e6; --mid-bg: #f8edd8; --hi-bg: #f7e1de;
  --shadow: 0 1px 2px rgba(23,38,42,.06), 0 8px 24px rgba(23,38,42,.07);
  --font-display: "Bricolage Grotesque", "Noto Kufi Arabic", "Noto Sans Devanagari", "Noto Sans Bengali", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "IBM Plex Sans Arabic", "Noto Sans Devanagari", "Noto Sans Bengali", "Segoe UI", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111a1c; --surface: #182326; --surface-2: #1e2b2e; --ink: #e7eeec; --muted: #9fb1ae;
  --line: #2c3c3f; --accent: #8cc97f; --accent-ink: #10200d; --accent-soft: #23362a; --plum: #e597c4;
  --lo: #7fcf93; --mid: #e7b65c; --hi: #f08a80; --lo-bg: #1c3325; --mid-bg: #3a2f1a; --hi-bg: #3d2220;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #111a1c; --surface: #182326; --surface-2: #1e2b2e; --ink: #e7eeec; --muted: #9fb1ae;
  --line: #2c3c3f; --accent: #8cc97f; --accent-ink: #10200d; --accent-soft: #23362a; --plum: #e597c4;
  --lo: #7fcf93; --mid: #e7b65c; --hi: #f08a80; --lo-bg: #1c3325; --mid-bg: #3a2f1a; --hi-bg: #3d2220;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme: dark; }
:root[lang="ur"] { --font-display: "IBM Plex Sans Arabic", system-ui, sans-serif; --font-body: "IBM Plex Sans Arabic", system-ui, sans-serif; }
:root[lang="ur"] h1, :root[lang="ur"] h2, :root[lang="ur"] h3 { letter-spacing: 0; line-height: 1.5; }
:root[lang="hi"] h1, :root[lang="hi"] h2, :root[lang="hi"] h3, :root[lang="bn"] h1, :root[lang="bn"] h2, :root[lang="bn"] h3 { letter-spacing: 0; line-height: 1.35; }
:root[lang="ar"] { --font-display: "Noto Kufi Arabic", "Bricolage Grotesque", system-ui, sans-serif;
                   --font-body: "IBM Plex Sans Arabic", "Atkinson Hyperlegible", system-ui, sans-serif; }

* { box-sizing: border-box; }
#splash { position: fixed; inset: 0; z-index: 1000; background: var(--bg); display: grid; place-items: center; transition: opacity .35s ease, visibility .35s; }
#splash.gone { opacity: 0; visibility: hidden; }
.splash-in { display: grid; justify-items: center; gap: 14px; color: var(--ink); font-family: var(--font-display); }
.splash-in svg { animation: splashPulse 1.4s ease-in-out infinite; border-radius: 18px; }
.splash-in i { width: 120px; height: 4px; border-radius: 99px; background: var(--surface-2); overflow: hidden; position: relative; }
.splash-in i::after { content: ""; position: absolute; inset-block: 0; width: 40%; background: var(--accent); border-radius: 99px; animation: splashBar 1.1s ease-in-out infinite; }
@keyframes splashPulse { 50% { transform: scale(1.06); } }
@keyframes splashBar { from { inset-inline-start: -40%; } to { inset-inline-start: 100%; } }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 var(--font-body); }
button, input, select { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; letter-spacing: -.01em; }
:root[lang="ar"] h1, :root[lang="ar"] h2, :root[lang="ar"] h3 { letter-spacing: 0; line-height: 1.35; }
.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.eyebrow { font-size: .72rem; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
:root[lang="ar"] .eyebrow { letter-spacing: 0; font-size: .8rem; }

/* ---------- top bar ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1480px; margin: 0 auto; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.brand-txt small { display: none; }
.brand { display: flex; align-items: center; gap: 10px; white-space: nowrap; text-decoration: none; color: inherit; }
.brand .logo { flex: none; border-radius: 11px; transition: transform .35s cubic-bezier(.2,.8,.2,1); }
.brand:hover .logo { transform: rotate(-8deg) scale(1.06); }
.brand-txt { display: flex; align-items: baseline; gap: 10px; }
@media (max-width: 980px) { .brand-txt small { display: none; } }
.brand h1 { font-size: 1.45rem; font-weight: 800; white-space: nowrap; }
.brand h1 span { color: var(--accent); }
.brand small { color: var(--muted); font-size: .8rem; }
.search { flex: 1 1 320px; min-width: 220px; position: relative; }
@media (max-width: 1560px) { .top-in .fav-label { display: none; } }
@media (max-width: 1100px) { .view-tabs button { padding: 7px 10px; } }
.search input { width: 100%; padding-block: 11px; padding-inline: 42px 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
.search svg { position: absolute; inset-inline-start: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 9px 14px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; text-decoration: none; color: inherit; }
.icon-btn:hover { border-color: var(--accent); }
.icon-btn[aria-pressed="true"] { border-color: var(--plum); color: var(--plum); }
.langs { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--surface); flex: none; }
.langs button { border: 0; background: none; padding: 8px 12px; cursor: pointer; font-size: .88rem; font-weight: 700; }
.langs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.langs { position: relative; overflow: visible; }
.lang-cur { display: inline-flex; gap: 6px; align-items: center; }
.lang-cur::after { content: "▾"; font-size: .7rem; opacity: .7; }
.only-narrow { display: none; }
.view-tabs { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px; flex: none; }
.view-tabs button { border: 0; background: none; border-radius: 999px; padding: 7px 14px; cursor: pointer; font-weight: 700; font-size: .9rem; color: var(--muted); }
.view-tabs button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
@media (max-width: 1100px) { .brand-txt small { display: none; } }
@media (max-width: 640px) { .view-tabs { display: none; } }

/* ---------- category ribbon ---------- */
.cats { max-width: 1480px; margin: 0 auto; padding: 4px 16px 12px; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: thin; }
.cat { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; cursor: pointer; font-size: .9rem; display: inline-flex; gap: 8px; align-items: center; }
.cat .num { color: var(--muted); font-size: .78rem; }
.cat[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.cat[aria-pressed="true"] .num { color: inherit; opacity: .7; }
.cat i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

/* ---------- main layout ---------- */
.wrap { max-width: 1480px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 60px; display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 26px; align-items: start; }
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 130px); max-height: calc(100vh - 150px); overflow: auto; padding-inline-end: 6px; scrollbar-width: thin; }
.rail-title { font-size: 1.3rem; font-weight: 800; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.facet { border-bottom: 1px solid var(--line); }
.facet summary { list-style: none; cursor: pointer; padding: 14px 2px; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 700; font-size: 1.02rem; }
.facet summary::-webkit-details-marker { display: none; }
.facet summary .sel { margin-inline-start: auto; background: var(--accent); color: var(--accent-ink); font-family: var(--font-data); font-size: .72rem; border-radius: 999px; padding: 1px 8px; }
.facet summary svg { transition: transform .15s; flex: none; color: var(--muted); }
.facet[open] summary svg { transform: rotate(180deg); }
.facet-body { padding: 0 2px 14px; display: grid; gap: 2px; }
.facet-note { font-size: .78rem; color: var(--muted); margin: -4px 0 6px; }
.check { display: flex; align-items: center; gap: 10px; padding: 5px 2px; cursor: pointer; font-size: .94rem; border-radius: 6px; }
.check:hover { background: var(--surface); }
.check input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; flex: none; }
.check .num { margin-inline-start: auto; color: var(--muted); font-size: .78rem; }
.check.zero { opacity: .45; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; }
.preset { border: 1px dashed var(--line); background: none; border-radius: 999px; padding: 5px 11px; font-size: .84rem; cursor: pointer; }
.preset[aria-pressed="true"] { border-style: solid; background: var(--accent-soft); border-color: var(--accent); color: var(--ink); font-weight: 700; }
.slider { display: grid; gap: 2px; margin-bottom: 10px; }
.slider label { display: flex; justify-content: space-between; font-size: .88rem; }
.slider output { font-family: var(--font-data); font-size: .8rem; color: var(--muted); }
.slider input { width: 100%; accent-color: var(--accent); }
.rail .txt { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.linkish { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; font-size: .85rem; text-decoration: underline; font-family: var(--font-body); font-weight: 400; }
.rail-foot { padding-top: 16px; }

/* ---------- results header ---------- */
.res-head { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.res-head h2 { font-size: 1.15rem; font-weight: 700; }
.res-head h2 .num { color: var(--accent); }
.active { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { display: inline-flex; align-items: center; gap: 6px; background: var(--accent-soft); border-radius: 999px; padding-block: 3px; padding-inline: 11px 6px; font-size: .82rem; }
.pill button { border: 0; background: none; cursor: pointer; font-size: 1rem; line-height: 1; padding: 0 4px; color: var(--muted); }
.sort { display: flex; gap: 8px; align-items: center; font-size: .88rem; color: var(--muted); }
.sort select { padding: 7px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); }

/* ---------- cards ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 18px; margin-top: 14px; }
.card { background: var(--surface); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column; cursor: pointer; border: 1px solid transparent; transition: transform .15s ease, border-color .15s; position: relative; }
.card:hover { transform: translateY(-2px); border-color: var(--line); }
.thumb { aspect-ratio: 4 / 3; max-width: 100%; position: relative; overflow: hidden; background: var(--surface-2); }
.thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transition: opacity .3s; }
.thumb img.ok { opacity: 1; }
.ph { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; padding: 14px; color: #fff; overflow: hidden; }
.ph b { font-family: var(--font-display); font-weight: 800; font-size: 1.3rem; line-height: 1.12; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; position: relative; }
.ph .art { position: absolute; inset: 0; width: 100%; height: 100%; }
.ph b { text-shadow: 0 1px 12px rgba(0,0,0,.25); }
.badges { position: absolute; top: 10px; inset-inline-start: 10px; display: flex; gap: 6px; }
.badge { background: rgba(10,20,22,.72); color: #fff; font-size: .72rem; font-weight: 700; padding: 3px 8px; border-radius: 999px; display: inline-flex; align-items: center; gap: 4px; }
.fav { position: absolute; top: 8px; inset-inline-end: 8px; width: 36px; height: 36px; border-radius: 50%; border: 0; background: rgba(255,255,255,.92); color: #7a2e5c; cursor: pointer; display: grid; place-items: center; }
.fav[aria-pressed="true"] svg { fill: currentColor; }
.card-body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 0; }
.card-body > .meta-line:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.card-body h3 { font-size: 1.04rem; font-weight: 700; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.6em; }
.meta-line { display: flex; gap: 8px; align-items: center; font-size: .8rem; color: var(--muted); flex-wrap: wrap; }
.stars { color: var(--plum); letter-spacing: 1px; font-size: .85rem; direction: ltr; }
.renal { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: auto; }
.mineral { border-radius: 8px; padding: 5px 7px; display: grid; }
.mineral { min-width: 0; }
.mineral span { font-size: .66rem; font-weight: 700; letter-spacing: .04em; opacity: .9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mineral b { font-family: var(--font-data); font-weight: 600; font-size: .86rem; }
.mineral b small { font-size: .62rem; font-weight: 500; opacity: .8; }
.lv-lo { background: var(--lo-bg); color: var(--lo); }
.lv-mid { background: var(--mid-bg); color: var(--mid); }
.lv-hi { background: var(--hi-bg); color: var(--hi); }
.lv-na { background: var(--surface-2); color: var(--muted); }
.more { display: flex; justify-content: center; padding: 28px 0 0; }
.empty { padding: 60px 20px; text-align: center; color: var(--muted); grid-column: 1 / -1; }
.empty h3 { color: var(--ink); margin-bottom: 6px; }

/* ---------- recipe sheet ---------- */
.recipe-page { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 40px; animation: sheetIn .45s cubic-bezier(.2,.8,.2,1); }
.recipe-page .sheet-in { background: var(--bg); }
body.reading .hero-band, body.reading .wrap, body.reading .cats, body.reading footer.site { display: none; }


.sheet-bar { position: static; margin: 2px 0 10px; border-radius: 14px; z-index: 2; display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; padding: 10px 16px; padding-top: calc(10px + env(safe-area-inset-top, 0px)); background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.sheet-bar .grp { display: flex; gap: 8px; flex-wrap: wrap; }
.hero { position: relative; max-width: 100%; height: clamp(220px, 34vw, 420px); background: var(--surface-2); overflow: hidden; border-radius: 18px; margin-top: 12px; }
.hero .backdrop { position: absolute; inset: -30px; width: calc(100% + 60px); height: calc(100% + 60px); object-fit: cover; filter: blur(28px) saturate(1.2); opacity: .55; }
.hero .photo { position: relative; display: block; height: 100%; width: auto; max-width: 100%; margin: 0 auto; object-fit: contain; animation: kenburns 9s ease-out both; }
.hero .ph b { font-size: clamp(1.4rem, 3vw, 2.2rem); -webkit-line-clamp: 2; }
.hero.nophoto { height: clamp(96px, 12vw, 140px); }

.hero.nophoto .ph b { font-size: clamp(1.2rem, 2.4vw, 1.7rem); }
.sheet-body { max-width: 1100px; margin-inline: auto; }
@media print {
  @page { margin: 14mm; }
  body { background: #fff; color: #000; font-size: 11pt; }
  .top, .sheet-bar, .hero-band, .wrap, footer.site, .add-day, .fav, .video, .video-link, .tr-note button, dialog { display: none !important; }
  .recipe-page { padding: 0; max-width: none; animation: none; }
  .hero { height: 70mm; border-radius: 8px; margin: 0 0 6mm; break-inside: avoid; }
  .hero.nophoto { display: none; }
  .hero .photo { animation: none; }
  .sheet-body { padding: 0; gap: 5mm; }
  .cols { grid-template-columns: 1.4fr 1fr; gap: 6mm; }
  ol.steps li, .ntable tr, .box, .dv { break-inside: avoid; }
  ol.steps li { border: 0; padding: 2px 0; background: none; }
  ul.ing input { display: none; }
  ul.ing li label { padding: 1px 0; }
  ul.ing li label::before { content: "□"; margin-inline-end: 6px; }
  .bar i, .gauge i, .ring .val, .card { animation: none !important; }
  .facts, .ntable, .box, .dv, .hints { box-shadow: none; }
  a[href]::after { content: ""; }
  .print-src { display: block !important; font-size: 9pt; color: #444; margin-top: 4mm; }
}
.print-src { display: none; }
.sheet-body { padding-inline: 22px; padding-block: 22px 50px; display: grid; gap: 22px; }

@keyframes rise { from { transform: translateY(14px) scale(.985); opacity: .35; } to { transform: none; opacity: 1; } }

@keyframes underline { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.35); } 100% { transform: scale(1); } }
@keyframes burst { from { transform: translate(-50%,-50%) scale(.2); opacity: 1; } to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1); opacity: 0; } }
@keyframes sheetIn { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fill { from { inline-size: 0; } }
@keyframes ring { from { stroke-dashoffset: var(--c); } }

const last2 = () => (weights[weights.length - 1] || {}).kg ?? +weightKg().toFixed(1);
function calcTool() {
  const k = $("#toolDlg").dataset.tool, s = u(), v = id => parseFloat($("#" + id)?.value), row = (a, b) => `<div class="calc-row"><span>${a}</span><b>${b}</b></div>`;
  const out = $("#tOut");
  if (k === "bmi" || k === "needs") {
    const w = v("tW"), h = v("tH");
    if (w > 0 && h > 0) { plan = { ...plan, weight: plan.unit === "lb" ? w / 0.4536 : w, height: h, sex: $("#tSex").value, ...(k === "needs" ? { age: v("tA") || 50, activity: +$("#tAct").value } : {}) }; store.set("plan", plan); }
    const n = needs();
    out.innerHTML = k === "bmi" ? `<div class="big">${n.bmi.toFixed(1)}</div><div>${s.bmiCat(n.bmi)}</div>${row(s.healthyRange, `${n.lo.toFixed(0)}–${n.hi.toFixed(0)} kg`)}${row(s.ibw, `${n.ibw.toFixed(1)} kg`)}${n.bmi >= 30 ? row(s.adjw, `${n.adj.toFixed(1)} kg`) : ""}`
      : `<div class="big">${(Math.round(n.tdee / 10) * 10).toLocaleString()} kcal</div><div>${s.tPerDay}</div>${row(s.bmr, `${Math.round(n.bmr)} kcal`)}${row(s.nutr[3] + ` (${u().profiles[plan.type]})`, `${n.protein} g · ${Math.round(n.protein / 3)} g / ${s.meal}`)}${plan.carbs ? row(s.nutr[4], `${plan.carbs} g · ${Math.round(plan.carbs / 15)} ${s.choicesW}`) : ""}`;
  }
  if (k === "fluid") { const ur = v("tU") || 0; plan = { ...plan, urine: ur }; store.set("plan", plan);
    const lo = ur + 500, hi = ur + 1000;
    out.innerHTML = `<div class="big">${lo.toLocaleString()}–${hi.toLocaleString()} ml</div><div>${s.tPerDay}</div>${row(s.cups250, `${(lo / 250).toFixed(1)}–${(hi / 250).toFixed(1)}`)}`; }
  if (k === "convert") {
    const salt = v("cSalt"), na = v("cNa"), carb = v("cCarb"), km = v("cKmmol"), pm = v("cPmmol"), nm = v("cNammol");
    out.innerHTML = [salt > 0 ? row(`${salt} g ${s.salt}`, `${Math.round(salt * 400)} mg ${s.nutr[0]}`) : "", na > 0 ? row(`${na} mg ${s.nutr[0]}`, `${(na / 400).toFixed(2)} g ${s.salt} · ${(na / 23).toFixed(1)} mmol`) : "",
      carb > 0 ? row(`${carb} g ${s.nutr[4]}`, `${(carb / 15).toFixed(1)} ${s.choicesW}`) : "", km > 0 ? row(`${km} mmol ${s.nutr[1]}`, `${Math.round(km * 39.1)} mg`) : "",
      pm > 0 ? row(`${pm} mmol ${s.nutr[2]}`, `${Math.round(pm * 31)} mg`) : "", nm > 0 ? row(`${nm} mmol ${s.nutr[0]}`, `${Math.round(nm * 23)} mg`) : ""].join("") || `<span class="foot-note">${s.convHint}</span>`;
  }
  if (k === "weight") {
    const xs = weights.slice(-60);
    if (xs.length >= 2) {
      const W = 520, H = 160, min = Math.min(...xs.map(x => x.kg)) - .5, max = Math.max(...xs.map(x => x.kg)) + .5;
      const X = i => 30 + i / (xs.length - 1) * (W - 44), Y = kg => H - 22 - (kg - min) / (max - min) * (H - 40);
      $("#wChart").innerHTML = `<svg class="wchart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
        ${[min + .5, (min + max) / 2, max - .5].map(g => `<line x1="30" x2="${W - 10}" y1="${Y(g)}" y2="${Y(g)}" stroke="var(--line)"/><text x="4" y="${Y(g) + 4}" font-size="10" fill="var(--muted)">${g.toFixed(1)}</text>`).join("")}
        <polyline points="${xs.map((x, i) => `${X(i)},${Y(x.kg)}`).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
        ${xs.map((x, i) => `<circle cx="${X(i)}" cy="${Y(x.kg)}" r="3" fill="var(--accent)"/>`).join("")}</svg>`;
    } else $("#wChart").innerHTML = `<p class="foot-note">${s.weightEmpty}</p>`;
    $("#wList").innerHTML = weights.slice().reverse().map((x, i, a) => { const prev = a[i + 1], d = prev ? x.kg - prev.kg : 0;
      return `<div><span>${x.d}</span><span>${x.kg} kg ${prev ? `<small style="color:var(--${Math.abs(d) >= 2 ? "hi" : "muted"})">${d > 0 ? "+" : ""}${d.toFixed(1)}</small>` : ""}</span><button class="linkish" data-tact="rmW" data-d="${x.d}">×</button></div>`; }).join("");
  }
}

function wordRoot(w) {
  const st = stemW(w), m = vocabRoots[lang]; return (m && m.get(st)) || st;
}
const dislikeCache = new Map();
function hasDislike(r) {
  const w = dislikeWords(); if (!w.length) return false;
  if (!vocabRoots[lang] && /^[؀-ۿ]/.test(w[0])) ingVocab();
  const text = fold([tx(r).title, ...tx(r).ing.map(x => x[1]), ...(r.t.en ? [r.t.en.title, ...r.t.en.ing.map(x => x[1])] : [])].join(" "));
  const key = r.id + "|" + lang; let roots = dislikeCache.get(key);
  if (!roots) { roots = new Set(text.split(/[^\p{L}\p{M}]+/u).filter(Boolean).map(wordRoot)); dislikeCache.set(key, roots); }
  return w.some(x => {
    if (/\s/.test(x)) return text.includes(x);
    const d = wordRoot(x);
    return roots.has(d) || [...roots].some(t => /^[a-z]/.test(d) && d.length >= 4 && t.startsWith(d));
  });
}

  const seg = (name, cur, opts) => `<div class="seg2" role="group">${opts.map(([v, l]) => `<button data-set="${name}" data-v="${v}" aria-pressed="${v === cur}">${l}</button>`).join("")}</div>`;
  return `<div class="plan-group"><h3>${s.setLang}</h3>${seg("lang", lang, Object.entries(LANGS_META).filter(([k]) => k === lang || !appCfg.hidden_langs.includes(k)).map(([k, m]) => [k, m.n]))}</div>
    <div class="plan-group"><h3>${s.setTheme}</h3>${seg("theme", theme, [["system", s.themeNames.system.split(": ").pop()], ["light", s.themeNames.light.split(": ").pop()], ["dark", s.themeNames.dark.split(": ").pop()]])}</div>
    <div class="plan-group"><h3>${s.unitsLabel}</h3>${seg("units", units, [["metric", s.unitsMetric], ["us", s.unitsUS]])}</div>
    <div class="plan-group"><h3>${s.setData}</h3><div class="mp-actions"><button class="icon-btn" data-set="clearDay">${s.clearDay}</button><button class="icon-btn" data-set="clearSaved">${s.clearSaved}</button></div></div>`;
}
// apply one settings choice; used by the settings dialog and the account page
function settingsAction(k, v) {
  if (k === "lang") return switchLang(v);
  if (k === "theme") { theme = v; store.set("theme", theme); applyTheme(); }
  if (k === "units") { units = v; store.set("units", units); if (current) openRecipe(current.id, false); }
  if (k === "clearDay") { day = []; saveDay(); toast(u().done); }
  if (k === "clearSaved") { favs.clear(); store.set("favs", []); syncNav(); $("#favCount").textContent = 0; toast(u().done); }
}
function openSettings() {
  const s = u();
  $("#setIn").innerHTML = `<h2 id="setTitle">${s.settings}</h2>${settingsGroups(s)}
    <div class="dlg-foot"><span></span><button class="btn-primary" data-set="close">${s.done}</button></div>`;
  // each section collapses; remember which ones the reader opened
  [...$("#setIn").querySelectorAll(".plan-group")].forEach((g, i) => {
    const h = g.querySelector("h3"), d = document.createElement("details");
    d.className = "set-sec"; d.dataset.i = i; d.open = setOpen.has(i);
    const sm = document.createElement("summary"); sm.innerHTML = `<span>${h.innerHTML}</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>`;
    h.remove(); const body = document.createElement("div"); body.className = "set-body";
    while (g.firstChild) body.append(g.firstChild);
    d.append(sm, body); g.replaceWith(d);
    d.addEventListener("toggle", () => d.open ? setOpen.add(i) : setOpen.delete(i));
  });
  if (!$("#setDlg").open) $("#setDlg").showModal();
}
const setOpen = new Set();
// ingredient words in the reader's language, for suggestions in the "foods I avoid" fields
const STOPW = new Set(("cup cups tablespoon tablespoons teaspoon teaspoons tbsp tsp ounce ounces oz pound pounds lb lbs g kg ml mg gram grams large small medium chopped sliced diced minced fresh frozen dried ground to taste and or of the a an for with optional divided cut into inch inches pieces piece finely thinly about plus more low sodium reduced fat free whole package can cans unsalted packed peeled seeded halved cooked raw drained rinsed softened melted room temperature extra virgin "
  + "taza tazas cucharada cucharadas cucharadita cucharaditas onza onzas libra libras gramos picado picada picados rebanado en de del la el los las y o al para con sin sal bajo baja grande grandes pequeño pequeña mediano mediana fresco fresca cortado cortada trozos "
  + "كوب أكواب كوبان ملعقة ملاعق ملعقتان كبيرة صغيرة صغيرتان غرام غ مل ملغ كغ حبة حبات حبتان مقطع مقطعة مقطعه مفروم مفرومة مفرومه طازج طازجة طازجه إلى الى أو او و من في مع حسب الرغبة قليل قليلة الصوديوم بدون ملح مطبوخ مطبوخة مجمد مجففة مجفف متوسطة متوسط كبير صغير قطع شرائح مكعبات حوالي إضافي اختياري معلبة علبة "
  + "tasse tasses cuillère cuillères soupe café gros grosse petit petite haché hachée tranché coupé en de du des la le les et ou pour avec sans sel frais fraîche "
  + "cangkir sendok makan teh gram besar kecil sedang cincang iris potong dan atau untuk dengan tanpa garam segar "
  + "tasa kutsara kutsarita gramo malaki maliit hiniwa tinadtad at o para sa ng may walang asin sariwa mga").split(" "));
let vocabCache = {}, vocabRoots = {};
// light plural folding for Latin-script languages: tomatoes → tomato, berries → berry, tomates → tomate
function stemW(f) {
  if (/^[\u0600-\u06ff]/.test(f)) {   // Arabic: drop the article and attached prefixes (الطماطم، والطماطم، بالطماطم → طماطم)
    const m = f.match(/^(?:[وفبكل]?ال|لل)(.{3,})$/); return m ? m[1] : f;
  }
  if (!/^[a-z]/.test(f) || f.length < 5) return f;
  if (f.endsWith("ies")) return f.slice(0, -3) + "y";
  if (/(oes|ches|shes|xes|ses|zes)$/.test(f)) return f.slice(0, -2);
  if (f.endsWith("s") && !f.endsWith("ss")) return f.slice(0, -1);
  return f;
}
function ingVocab() {
  if (vocabCache[lang]) return vocabCache[lang];
  const cnt = new Map();
  for (const r of R) {
    if (!hasLang(r)) continue;
    const seen = new Set();
    for (const [, line] of (tx(r).ing || [])) {
      const clean = (line || "").replace(/\([^)]*\)/g, " ").replace(/[\d¼½¾⅓⅔⅛.,;:/\-–—%*"'“”،؛]+/g, " ");
      for (const w of clean.split(/\s+/)) {
        const k = w.trim(); if (k.length < 3) continue;
        const f = fold(k); if (STOPW.has(f) || STOPW.has(k.toLowerCase())) continue;
        const st = stemW(f); if (seen.has(st)) continue; seen.add(st);
        const c = cnt.get(st) || cnt.set(st, { n: 0, forms: {} }).get(st); c.n++; c.forms[k.toLowerCase()] = (c.forms[k.toLowerCase()] || 0) + 1;
      }
    }
  }
  // merge forms into a root found in the same vocabulary: البصل/وبصل/بصلة/بصلات → بصل, tomatoes → tomato
  const ar = /^[؀-ۿ]/, PRE = ["وال", "بال", "فال", "كال", "لل", "ال", "و", "ب", "ف", "ك", "ل"], SUF = ["ات", "ه", "ين", "ان"];
  const rootOf = new Map();
  const findRoot = st => {
    if (rootOf.has(st)) return rootOf.get(st);
    let best = st;
    if (ar.test(st)) {
      const cands = [];
      for (const p of PRE) if (st.startsWith(p) && st.length - p.length >= 3) cands.push(st.slice(p.length));
      for (const c of [st, ...cands]) for (const x of SUF) if (c.endsWith(x) && c.length - x.length >= 3) cands.push(c.slice(0, -x.length));
      for (const c of cands) if (cnt.has(c) && cnt.get(c).n >= cnt.get(st).n / 4 && c !== st) { best = findRoot(c); break; }
    }
    rootOf.set(st, best); return best;
  };
  const merged = new Map();
  for (const [st, x] of cnt) {
    const root = findRoot(st), m = merged.get(root) || merged.set(root, { n: 0, forms: {} }).get(root);
    m.n += x.n; for (const [f, c] of Object.entries(x.forms)) m.forms[f] = (m.forms[f] || 0) + c;
  }
  vocabRoots[lang] = rootOf;
  // one entry per word, shown in its root (singular) form when it exists
  return (vocabCache[lang] = [...merged.entries()].filter(([, x]) => x.n >= 3).map(([st, x]) => {
    const forms = Object.entries(x.forms).sort((a, b) => b[1] - a[1]).map(f => f[0]);
    return { w: forms.find(f => stemW(fold(f)) === st) || forms.sort((a, b) => a.length - b.length)[0], n: x.n, k: st };
  }).sort((a, b) => b.n - a.n));
}
function showSugg(input) {
  const box = document.querySelector(`.sugg[data-for="${input.id}"]`); if (!box) return;
  const parts = input.value.split(/[,،]/), last = fold(parts[parts.length - 1].trim()), have = new Set(parts.slice(0, -1).map(x => fold(x.trim())));
  if (last.length < 1) { box.innerHTML = ""; return; }
  const lr = stemW(last), hits = ingVocab().filter(x => !have.has(fold(x.w)) && (x.k.startsWith(lr) || fold(x.w).startsWith(last)))
    .sort((a, b) => b.n - a.n).slice(0, 8);
  box.innerHTML = hits.map(x => `<button type="button" data-sug="${esc(x.w)}">${esc(x.w)} <small>${x.n}</small></button>`).join("");
}
$("#account").addEventListener("input", e => { if (["pfDislikes", "pfAllergies", "pfLikes"].includes(e.target.id)) showSugg(e.target); });
$("#account").addEventListener("focusin", e => { if (["pfDislikes", "pfAllergies", "pfLikes"].includes(e.target.id) && e.target.value) showSugg(e.target); });
$("#account").addEventListener("mousedown", e => { if (e.target.closest("[data-sug]")) e.preventDefault(); });
$("#account").addEventListener("click", e => {
  const b = e.target.closest("[data-sug]"); if (!b) return;
  const box = b.closest(".sugg"), input = $("#" + box.dataset.for), parts = input.value.split(/[,،]/);
  parts[parts.length - 1] = " " + b.dataset.sug;
  input.value = parts.map(x => x.trim()).filter(Boolean).join(lang === "ar" || lang === "ur" ? "، " : ", ") + (lang === "ar" || lang === "ur" ? "، " : ", ");
  box.innerHTML = ""; input.focus(); input.dispatchEvent(new Event("change", { bubbles: true }));
});
$("#account").addEventListener("change", e => {
  const id = e.target.id, val = e.target.value;
  if (!id || !id.startsWith("pf")) return;
  const num = parseFloat(val);
  if (id === "pfName") profile.name = val.trim();
  if (id === "pfAge" && num > 0) plan.age = num;
  if (id === "pfSex") plan.sex = val;
  if (id === "pfH" && num > 0) plan.height = num;
  if (id === "pfW" && num > 0) plan.weight = plan.unit === "lb" ? num / 0.4536 : num;
  if (id === "pfAct") plan.activity = +val;
  if (id === "pfTarget") profile.target = num > 0 ? num : null;
  if (id === "pfDislikes") profile.dislikes = val;
  if (id === "pfAllergies") profile.allergies = val;
  if (id === "pfLikes") profile.likes = val;
  if (id === "pfHide") profile.hideDislikes = e.target.checked;
  if (id === "pfDoctor") profile.doctor = val;
  if (id === "pfMeds") profile.meds = val;
  saveProfile(); store.set("plan", plan); recCache = null; mpCache = null;
  for (const k in RLcache) delete RLcache[k];
  if (view === "dash") renderDash(); else if (view !== "account") render();
  renderAccount();
});
$("#settingsBtn").addEventListener("click", openSettings);
$("#shopBtn").addEventListener("click", () => setView("shop"));
$("#setDlg").addEventListener("click", e => {
  if (e.target === $("#setDlg")) return $("#setDlg").close();
  const b = e.target.closest("[data-set]"); if (!b) return; const k = b.dataset.set, v = b.dataset.v;
  if (k === "close") return $("#setDlg").close();
  if (k === "plan") { $("#setDlg").close(); openPlan(); return; }
  Promise.resolve(settingsAction(k, v)).then(() => { if ($("#setDlg").open) openSettings(); });
});

// ---------- theme ----------
let theme = store.get("theme", CFG0?.defaults?.theme || "system");
const THEME_ICON = { system: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>`,
  dark: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>`,
  light: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>` };
function applyTheme() {
  if (theme === "system") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = theme;

}

// bottom navigation (phones) forwards to the header controls
document.querySelector(".bottom-nav").addEventListener("click", e => { const b = e.target.closest("[data-proxy]"); if (b) $(b.dataset.proxy).click(); });
function syncNav() { $("#navDay").textContent = day.length || ""; $("#navFav").textContent = favs.size || "";
  document.querySelector('.bottom-nav [data-proxy="#favOnly"]').classList.toggle("on", state.favOnly); }

// ---------- start ----------
const hm = location.hash.match(/^#(?:(en|es|ar|ur|hi|fr|id|bn|tl)-?)?(dash|recipes|about|account|admin|shop)?(?:r(\d+))?$/) || [];
if (hm[1]) lang = hm[1];
if (!LANGS_META[lang]) lang = "en";
state.sort = SORT_OK(state.sort);
(async () => {
await ensureLang(lang);
applyLang();
applyTheme();
$("#dayCount").textContent = day.length;
render();
setView(hm[3] ? "recipes" : hm[2] || "dash", false);
if (hm[3]) openRecipe(+hm[3], false);
startSlides();
hideSplash();
initAuth();
loadDetails().then(() => renderToday());   // steps and tips, after the first screen
})();
